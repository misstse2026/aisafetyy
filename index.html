    // Fisher-Yates 洗牌演算法
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 開始遊戲
    function startGame() {
      currentQuestions = shuffleArray(questionBank).slice(0, 5);
      currentIndex = 0;
      score = 0;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');

      showQuestion();
    }

    // 顯示當前題目
    function showQuestion() {
      const q = currentQuestions[currentIndex];
      
      document.getElementById('question-number').innerText = `第 ${currentIndex + 1} / 5 題`;
      document.getElementById('score-count').innerText = `⭐ 得分：${score}`;
      document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / 5) * 100}%`;
      
      // 更新插圖媒體：嘗試載入切片圖片，若載入不順則自動顯示視覺 Emoji
      const mediaBox = document.getElementById('question-media');
      mediaBox.innerHTML = `
        <img src="${mainImageUrl}" alt="情境圖" 
             style="object-fit: cover; object-position: ${q.pos}; width: 100%; height: 100%;"
             onerror="this.onerror=null; this.parentNode.innerHTML='<span>${q.emoji}</span>';">
      `;

      document.getElementById('question-tag').innerText = `情境：${q.tag}`;
      document.getElementById('question-text').innerText = q.question;

      document.getElementById('answer-buttons').classList.remove('hidden');
      document.getElementById('feedback').classList.add('hidden');
    }

    // 檢查答案
    function checkAnswer(userAnswer) {
      const q = currentQuestions[currentIndex];
      const isCorrect = (userAnswer === q.answer);

      document.getElementById('answer-buttons').classList.add('hidden');
      const feedbackDiv = document.getElementById('feedback');
      const resultText = document.getElementById('feedback-result');
      const expText = document.getElementById('feedback-explanation');

      feedbackDiv.classList.remove('hidden');

      if (isCorrect) {
        score += 20;
        resultText.innerHTML = `<span>🎉</span><span>答對囉！你太棒了！</span>`;
        resultText.className = "font-black text-xl text-emerald-600 flex items-center gap-1";
        feedbackDiv.className = "p-4 rounded-2xl border-2 text-left space-y-2 bg-emerald-50 border-emerald-300";
      } else {
        resultText.innerHTML = `<span>💡</span><span>再想一想喔！</span>`;
        resultText.className = "font-black text-xl text-rose-600 flex items-center gap-1";
        feedbackDiv.className = "p-4 rounded-2xl border-2 text-left space-y-2 bg-rose-50 border-rose-300";
      }

      expText.innerText = q.explanation;
      document.getElementById('score-count').innerText = `⭐ 得分：${score}`;
    }

    // 下一題
    function nextQuestion() {
      currentIndex++;
      if (currentIndex < 5) {
        showQuestion();
      } else {
        endGame();
      }
    }

    // 結束結算
